<div align="center">
  <table>
    <tr>
      <td width="70%" valign="middle">
        <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="300" viewBox="0 0 700 300" role="img">
          <title>Shivam Tiwary — Developer Profile</title>
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop stop-color="#070b16"/>
              <stop offset="1" stop-color="#101a31"/>
            </linearGradient>
            <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
              <stop stop-color="#247bff"/>
              <stop offset="1" stop-color="#ff354f"/>
            </linearGradient>
            <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
              <circle cx="2" cy="2" r="1" fill="#55709c" opacity=".25"/>
            </pattern>
          </defs>
          <style>
            text{font-family:Arial,Helvetica,sans-serif}
            .muted{fill:#9eabc4}
            .white{fill:#f4f6fb}
            .blue{fill:#247bff}
          </style>
          <rect width="100%" height="100%" rx="22" fill="url(#bg)"/>
          <rect width="100%" height="100%" rx="22" fill="url(#dots)"/>
          <rect x="0" y="0" width="100%" height="5" fill="url(#line)"/>
          <text x="42" y="48" font-size="15" letter-spacing="3" class="blue">HELLO WORLD / DEVELOPER PROFILE</text>
          <text x="42" y="118" font-size="43" font-weight="800" class="white">Hi, I'm Shivam Tiwary</text>
          <text x="44" y="158" font-size="20" class="muted">MCA Student · Aspiring Full-Stack Java Developer</text>
          <text x="44" y="198" font-size="16" class="white">Building practical applications, learning continuously,</text>
          <text x="44" y="222" font-size="16" class="white">and solving problems with code.</text>
          <rect x="44" y="250" width="210" height="34" rx="17" fill="#172b4b" stroke="#247bff"/>
          <text x="62" y="272" font-size="14" class="white">Greater Noida, India</text>
        </svg>
      </td>
      <td width="30%" align="center" valign="middle">
        <img src="https://avatars.githubusercontent.com/u/245594219?v=4"
             width="160"
             height="160"
             alt="Shivam Tiwary"
             style="border-radius:50%;border:3px solid #247bff;box-shadow:0 0 20px rgba(36,123,255,0.6);" />
        <br/>
        <sub><b>Shivam Tiwary</b></sub>
      </td>
    </tr>
  </table>
</div>
